{% extends "layout/basic.html" %}
{% block content %}
{% raw %}<style>
  #hutoj-monitor {
    font-size: 16px;
    color: #3d313d;
  }
  #hutoj-monitor * {
    box-sizing: border-box;
  }
  #hutoj-monitor [hidden] {
    display: none !important;
  }
  #hutoj-monitor .monitor-head {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  #hutoj-monitor h1 {
    font-size: 24px;
    flex: 1;
  }
  #hutoj-monitor button {
    font: inherit;
    background: #f6edf6;
    color: #580d55;
    border: 1px solid #e8dce8;
    border-radius: 7px;
    padding: 10px 16px;
    cursor: pointer;
  }
  #hutoj-monitor button.selected {
    background: #580d55;
    color: #fff;
  }
  #hutoj-monitor button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #hutoj-monitor .monitor-layout {
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr);
    gap: 20px;
  }
  #hutoj-monitor .monitor-clients {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 75vh;
    overflow: auto;
  }
  #hutoj-monitor .monitor-client {
    text-align: left;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  #hutoj-monitor .monitor-client span {
    font-size: 14px;
  }
  #hutoj-monitor .monitor-device {
    display: grid;
    gap: 6px;
    margin: 0 0 16px;
    font-size: 16px;
    line-height: 1.6;
  }
  #hutoj-monitor .monitor-device > div {
    display: flex;
    gap: 12px;
    min-width: 0;
  }
  #hutoj-monitor .monitor-device dt {
    font-weight: 600;
    flex-shrink: 0;
    color: #3d313d;
  }
  #hutoj-monitor .monitor-device dd {
    margin: 0;
    overflow-wrap: anywhere;
    color: #3d313d;
  }
  #hutoj-monitor video {
    width: 100%;
    max-height: 65vh;
    background: #171217;
    object-fit: contain;
  }
  #hutoj-monitor .monitor-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0;
    flex-wrap: wrap;
  }
  #hutoj-monitor select {
    font-size: 16px;
    max-width: 100%;
    padding: 10px;
    border: 1px solid #dcd5dc;
    border-radius: 6px;
  }
  #hutoj-monitor [role='alert'] {
    color: #a33540;
    font-size: 16px;
    line-height: 1.6;
    margin: 12px 0;
  }
  #hutoj-monitor .monitor-events {
    font-size: 16px;
    line-height: 1.6;
    overflow: auto;
    max-height: 320px;
  }
  #hutoj-monitor .monitor-events li {
    padding: 8px 0;
    border-bottom: 1px solid #eadfea;
    color: #a33540;
  }
  @media (max-width: 800px) {
    #hutoj-monitor .monitor-layout {
      grid-template-columns: 1fr;
    }
    #hutoj-monitor .monitor-clients {
      max-height: 220px;
    }
  }
</style>{% endraw %}
<div class="row">
  <div class="columns">
    <div class="section">
      <div class="section__body">
        <div
          id="hutoj-monitor"
          data-endpoint="{{ url('hutoj_client_monitor', tid=tdoc.docId) }}"
          data-csrf="{{ csrf }}"
          data-opened-at="{{ openedAt }}">
          <button type="button" hidden data-action="notify">启用桌面掉线通知</button>
          <div role="status" aria-live="polite" data-offline-notices></div>
          <div class="monitor-head">
            <h1>屏幕监控 · {{ tdoc.title }}</h1>
            <button type="button" data-action="refresh">刷新</button>
            <a href="{{ url('contest_detail', tid=tdoc.docId) }}">返回比赛</a>
          </div>
          <div class="monitor-layout">
            <div class="monitor-clients" aria-label="选手列表"></div>
            <div>
              <h2 class="monitor-name" style="font-size: 20px; margin-bottom: 16px"></h2>
              <dl class="monitor-device" aria-label="选手设备信息" hidden>
                <div>
                  <dt>系统</dt>
                  <dd data-device="system"></dd>
                </div>
                <div>
                  <dt>IP</dt>
                  <dd data-device="ip"></dd>
                </div>
              </dl>
              <video controls playsinline muted aria-label="选手屏幕"></video>
              <div class="monitor-toolbar">
                <button type="button" data-action="live" disabled>实时查看</button>
                <button type="button" data-action="stop" disabled>停止播放</button>
                <button type="button" data-action="recordings" disabled>录像回放</button>
                <button type="button" data-action="events" disabled>违规记录</button>
                <button type="button" data-action="clear-warning" hidden>解除全屏警告</button>
              </div>
              <div class="monitor-toolbar" data-replay hidden>
                <select aria-label="录像时间"></select>
                <button type="button" data-action="play">播放录像</button>
              </div>
              <p role="alert" hidden></p>
              <div class="monitor-events" hidden>
                <h3 style="font-size: 18px">进程违规记录</h3>
                <ul></ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="{{ url('hutoj_client_monitor_script', tid=tdoc.docId) }}" defer></script>
{% endblock %}
